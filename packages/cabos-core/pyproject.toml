[project]
name = "cabos-core"
version = "0.1.0"
description = "CabOS pure domain logic: no I/O, deterministic given a clock and a seed (ADR-001, ADR-004)."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9", "pyyaml>=6.0", "numpy>=2.1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cabos_core"]
