[project]
name = "cabos"
version = "0.1.0"
description = "CabOS workspace root (not a distributable package)"
requires-python = ">=3.12,<3.13"
dependencies = ["cabos-core", "cabos-api", "cabos-edge-sim"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx2>=0.1",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "pre-commit>=4.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/cabos-core", "services/api", "services/edge-sim"]

[tool.uv.sources]
cabos-core = { workspace = true }
cabos-api = { workspace = true }
cabos-edge-sim = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps", "node_modules", "services/api/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "PT", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow unicode (×, →, ≥) in strings and docs

[tool.ruff.lint.isort]
known-first-party = ["cabos_core", "cabos_api", "cabos_edge"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["DTZ001"]

[tool.pytest.ini_options]
testpaths = ["packages/cabos-core/tests", "services/api/tests", "services/edge-sim/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --import-mode=importlib"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/cabos-core/src", "services/api/src", "services/edge-sim/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "cabos_core.*"
strict = true

[[tool.mypy.overrides]]
module = ["cabos_api.*", "cabos_edge.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
