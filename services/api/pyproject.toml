[project]
name = "cabos-api"
version = "0.1.0"
description = "CabOS API: REST /api/v1, WebSocket, jobs, persistence."
requires-python = ">=3.12,<3.13"
dependencies = [
  "cabos-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlmodel>=0.0.22",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cabos_api"]
