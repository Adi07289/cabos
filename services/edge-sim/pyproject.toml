[project]
name = "cabos-edge-sim"
version = "0.1.0"
description = "CabOS edge simulator and safety runtime (ADR-003)."
requires-python = ">=3.12,<3.13"
dependencies = ["cabos-core"]

[project.scripts]
cabos-edge = "cabos_edge.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cabos_edge"]
